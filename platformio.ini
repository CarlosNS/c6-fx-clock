; Marea: watch firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06
; (S3R8: 8 MB octal PSRAM, 32 MB quad flash). ESP-IDF options: sdkconfig.defaults
[platformio]
default_envs = s3amoled

[env:s3amoled]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 7340032
board_build.embed_txtfiles =
    src/index.html
    src/transport.js
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
