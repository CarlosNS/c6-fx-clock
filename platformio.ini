; FX Clock: one firmware, one environment per board (see docs/PLAN-s3.md)
[platformio]
; plain `pio run` keeps building the C6 only
default_envs = c6lcd

; Waveshare ESP32-C6-LCD-1.47
[env:c6lcd]
platform = espressif32@6.12.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 3670016
board_build.embed_txtfiles =
    src/index.html
    src/transport.js
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Waveshare ESP32-S3-Touch-AMOLED-2.06 (S3R8: 8 MB octal PSRAM, 32 MB quad flash).
; Its ESP-IDF options are in sdkconfig.defaults.esp32s3, applied on top of sdkconfig.defaults.
[env:s3amoled]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions_s3.csv
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 7340032
board_build.embed_txtfiles =
    src/index.html
    src/transport.js
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
