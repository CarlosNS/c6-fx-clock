[pytest]
# Run one phase at a time: pytest -m phase2   (see docs/PLAN-bluetooth.md)
markers =
    now: runs against the current firmware (2.0.0)
    phase1: boot modes
    phase2: Bluetooth transport
    phase3: Bluetooth security
    phase4: screenshots over Bluetooth
    phase5: Android app
    phase6: updates over the internet
    slow: takes more than a minute
addopts = -ra
